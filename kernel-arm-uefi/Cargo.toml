[package]
name = "kernel-arm-uefi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Eve Authors"]

[[bin]]
name = "bootaa64"
path = "src/main.rs"
test = false

[dependencies]
kernel = { path = "../kernel" }
# No `panic_handler` feature: upstream handler calls RuntimeServices::ResetSystem(SHUTDOWN),
# which Apple firmware often treats as reboot → GRUB chainload boot loop. We provide our own.
uefi = { version = "0.37", default-features = false }
uefi-raw = "0.14"
