[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Eve Authors"]

[features]
# The `kernel` binary is x86_64 + `bootloader_api` only. The **32-bit Multiboot** binary is the
# `kernel-i686` bin in this crate (nightly `-Z build-std`, see `scripts/build-kernel-i686.sh`).
# Host `cargo check --workspace` on AArch64 hosts still type-checks the library only.
default = []
kernel-bin = []
# Multiboot v1 binary for `i686-unknown-none` (nightly `-Z build-std`, see `scripts/build-kernel-i686.sh`).
kernel-bin-i686 = []

[lib]
name = "kernel"
path = "src/lib.rs"
test = false

[[bin]]
name = "kernel"
required-features = ["kernel-bin"]
test = false
bench = false

[[bin]]
name = "kernel-i686"
path = "src/kernel_i686_main.rs"
required-features = ["kernel-bin-i686"]
test = false
bench = false

[dependencies]
embedded-io = { version = "0.7", default-features = false }
embedded-tls = { version = "0.18", default-features = false, features = ["rustpki"] }
rand_core = { version = "0.6", default-features = false }
der = { version = "0.8", default-features = false, features = ["derive", "oid", "time", "heapless"] }
p256 = { version = "0.13", default-features = false }
signature = { version = "2.2", default-features = false }
# `sha2` / `aes` default x86_64 paths use intrinsics that nightly LLVM cannot codegen for
# `x86_64-unknown-none` ("Do not know how to split the result of this operator!").
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
miniz_oxide = { version = "0.8", default-features = false }
brotli-decompressor = { version = "5.0.0", default-features = false }

[target.'cfg(any(target_arch = "x86_64", target_arch = "x86"))'.dependencies]
bootloader_api = "0.11"
