[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Eve Authors"]
build = "build.rs"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
bootloader_api = "0.11"
embedded-io = { version = "0.7", default-features = false }
embedded-tls = { version = "0.18", default-features = false }
rand_core = { version = "0.6", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
